<?xml version="1.0" encoding="UTF-8"?>
<!-- Shivaa Black — box sleeve artwork mock (front). Scale: 10 units = 1 mm.
     176 x 96 mm. Gold is Pantone 871 C (shown here as #b98a2f/#d4af5a). -->
<svg xmlns="http://www.w3.org/2000/svg" width="176mm" height="96mm"
     viewBox="0 0 1760 960" role="img" aria-label="Shivaa Black box sleeve, front">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c877"/>
      <stop offset=".38" stop-color="#b98a2f"/>
      <stop offset=".62" stop-color="#d4af5a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1760" height="960" fill="#12100e"/>
  <rect width="1760" height="960" fill="url(#sheen)"/>

  <!-- hairline frame (0.2 mm) -->
  <rect x="90" y="70" width="1580" height="820" fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- ring motif: spot UV area -->
  <circle cx="880" cy="470" r="250" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".55"/>
  <circle cx="880" cy="470" r="266" fill="none" stroke="url(#gold)" stroke-width="1" opacity=".3"/>

  <!-- wordmark -->
  <text x="880" y="452" text-anchor="middle" fill="url(#gold)"
        font-family="Marcellus,'Cormorant Garamond',Georgia,serif" font-size="128"
        letter-spacing="18">SHIVAA</text>
  <text x="880" y="512" text-anchor="middle" fill="#f0e4cc"
        font-family="Marcellus,'Cormorant Garamond',Georgia,serif" font-size="52"
        letter-spacing="30">BLACK</text>

  <line x1="700" y1="556" x2="1060" y2="556" stroke="url(#gold)" stroke-width="2"/>

  <!-- promise line -->
  <text x="880" y="628" text-anchor="middle" fill="#efe3cb"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34"
        letter-spacing="4">A card. A little silver. Twenty percent off the craft.</text>
  <text x="880" y="678" text-anchor="middle" fill="#c9a86a"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27"
        letter-spacing="2">एक कार्ड। थोड़ी चांदी। कारीगरी पर बीस प्रतिशत कम।</text>

  <!-- serial patch: unvarnished cream, written by hand -->
  <rect x="1330" y="770" width="300" height="80" fill="#faf6ef"/>
  <text x="1360" y="822" fill="#2b2118"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30"
        letter-spacing="1">No. 0142 / 0500</text>

  <!-- folio -->
  <text x="130" y="822" fill="#8d7a5c"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24"
        letter-spacing="3">SHIVAA JEWELS · JAYAL</text>
</svg>
