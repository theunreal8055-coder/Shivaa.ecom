<?xml version="1.0" encoding="UTF-8"?>
<!-- Shivaa Black — card front. Scale: 10 units = 1 mm. 85.60 x 53.98 mm. -->
<svg xmlns="http://www.w3.org/2000/svg" width="85.6mm" height="53.98mm"
     viewBox="0 0 856 540" role="img" aria-label="Shivaa Black membership card, front">
  <defs>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c877"/>
      <stop offset=".4" stop-color="#b98a2f"/>
      <stop offset=".66" stop-color="#d4af5a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141210"/>
      <stop offset=".55" stop-color="#0d0c0a"/>
      <stop offset="1" stop-color="#1b1713"/>
    </linearGradient>
  </defs>

  <rect width="856" height="540" rx="32" fill="url(#cardface)"/>
  <rect x="14" y="14" width="828" height="512" rx="24" fill="none"
        stroke="url(#gold2)" stroke-width="1.5" opacity=".75"/>

  <!-- wordmark block -->
  <text x="52" y="96" fill="url(#gold2)"
        font-family="Marcellus,'Cormorant Garamond',Georgia,serif" font-size="46"
        letter-spacing="9">SHIVAA</text>
  <line x1="52" y1="118" x2="330" y2="118" stroke="url(#gold2)" stroke-width="1.5" opacity=".8"/>

  <text x="52" y="164" fill="#f4e8d0"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21"
        letter-spacing="7">SHIVAA BLACK</text>
  <text x="52" y="192" fill="#9c8a6c"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13"
        letter-spacing="3">MEMBER SINCE 11 / 2026</text>

  <!-- holder -->
  <text x="52" y="290" fill="#faf6ef"
        font-family="Cormorant Garamond,Georgia,serif" font-size="40">Priya Sharma</text>
  <text x="52" y="322" fill="#c9a86a"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15"
        letter-spacing="3">SBM 0042 · CARD 0001 0421</text>

  <!-- the privilege -->
  <line x1="52" y1="356" x2="470" y2="356" stroke="#3a332a" stroke-width="1"/>
  <text x="52" y="404" fill="url(#gold2)"
        font-family="Marcellus,Georgia,serif" font-size="30" letter-spacing="2">20 % OFF MAKING CHARGES</text>
  <text x="52" y="436" fill="#9c8a6c"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14"
        letter-spacing="4">SIX MONTHS · FREE TO RENEW</text>

  <!-- QR -->
  <rect x="648" y="286" width="156" height="156" fill="#faf6ef" rx="6"/>
  <g fill="#12100e">
    <rect x="664" y="302" width="42" height="42"/><rect x="714" y="302" width="42" height="42"/>
    <rect x="764" y="302" width="24" height="24"/><rect x="664" y="352" width="42" height="42"/>
    <rect x="664" y="412" width="24" height="24"/><rect x="700" y="390" width="14" height="14"/>
    <rect x="722" y="412" width="14" height="14"/><rect x="744" y="390" width="14" height="14"/>
    <rect x="766" y="412" width="18" height="18"/><rect x="700" y="356" width="14" height="14"/>
    <rect x="726" y="360" width="18" height="18"/><rect x="754" y="368" width="14" height="14"/>
    <rect x="782" y="344" width="10" height="10"/><rect x="714" y="428" width="12" height="12"/>
    <rect x="786" y="428" width="8" height="8"/>
  </g>
  <text x="726" y="470" text-anchor="middle" fill="#8d7a5c"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11"
        letter-spacing="1">shivaa.in</text>

  <text x="52" y="500" fill="#6f6353"
        font-family="Jost,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11"
        letter-spacing="2">ERNATE SHINE JEWELLERY PVT. LTD. · JAYAL, NAGAUR</text>
</svg>
