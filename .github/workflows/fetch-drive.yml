name: fetch-drive-assets
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/fetch-drive.yml']
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -U gdown
      - name: Download each Drive file by ID
        run: |
          set -x
          mkdir -p inbound-drive
          : > inbound-drive/fetch-log.txt
          get() { # name id ext
            name="$1"; id="$2"; ext="$3"
            for try in 1 2 3; do
              if gdown "$id" -O "inbound-drive/${name}.${ext}" >> inbound-drive/fetch-log.txt 2>&1; then
                sz=$(stat -c%s "inbound-drive/${name}.${ext}" 2>/dev/null || echo 0)
                if [ "$sz" -gt 5000 ]; then echo "OK $name ${sz}"; return 0; fi
              fi
              sleep 3
            done
            echo "FAIL $name $id" | tee -a inbound-drive/fetch-log.txt
            return 0
          }
          get bajubandh       1Vv3TNusuTRIrJOuelmmN4Mwz0MUOWP61 jpg
          get hathphool        1t6f60Xpraw7YClUi8sY06Igi7ofsZaQQ jpg
          get pendants         19rIAO_vzp_sQU3Hc1VSm9Iat_gR2X7Nt jpg
          get bracelets        1mbTFQ7nUYQhJgvPWXtL_ap3Ly3xszWR jpg
          get bridal-anklets   1Bta_hNbQVE-aQyjAXEGJwfmwf6d9wVQO jpg
          get earrings         1-iNrU8h0UcAk5KKQOWBEgZyun8MzInpz jpg
          get chains           1t8xNwzAJ37bzlzPaEnizoq94LAc7hOun jpg
          get rings            1Un8pnQgBHAlTmA3C8dxNPr4_Z4-ASf6l jpg
          get nosepins         1wFjVCCc2TC-p5XiahNwJHBq5gXK1Q08a jpg
          get aad              1Th8TOGhYWjjaVON-ns2txOKx_bYZq1VT jpg
          get necklace         1I_ibQp22UhdU4fmzQ0ngDbCNA-yErGjw jpg
          get silver925        1YrsLOPNhJilHJEhBh1lWH_tz3x-JuFYO jpg
          get sheeshphool      1cPWfmIKfiEnraWMuWltwF6f8UITjwdoE jpg
          get bangles          1203fZbH7J9S8G8UCKbC97aGWzTDbYDkx jpg
          get rakhdi-set       1fT96J6CfdNJ1aFju1DRvOzQm1VTzN_oS jpg
          get mangalsutra      1QRppGfbECyBZVhtzRC013wZSh5bmmE_X jpg
          get bullion-ui       1quEo72Cj73RaAzUtqZnl_moOO-Y1t7Fj png
          ls -la inbound-drive
          file inbound-drive/* || true
      - name: Commit assets back
        run: |
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -A inbound-drive
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: inbound Drive assets for v57 category slider + bullion UI"
          git push
