name: fetch-drive-assets
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/fetch-drive.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q -U "gdown>=5.2"
      - name: Dump folder listing and download all
        run: |
          mkdir -p inbound-drive/folder
          # verbose folder fetch: gdown prints the google id of each file it pulls
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1wH2SYhFr92mBXURiG2gH-g_zVDq_IeVc" -O inbound-drive/folder 2>&1 | tee inbound-drive/folder-dump.txt || true
          echo "--- tree ---"; find inbound-drive/folder -type f -printf '%s\t%p\n' | sort -k2
          # explicit retry of bracelets with both URL shapes
          for u in \
            "https://drive.usercontent.google.com/download?id=1mbTFQ7nUYQhJgvPWXtL_ap3Ly3xszWR3&export=download&confirm=t" \
            "https://drive.google.com/uc?id=1mbTFQ7nUYQhJgvPWXtL_ap3Ly3xszWR3&export=download" ; do
            curl -sSL "$u" -o inbound-drive/bracelets2.jpg || true
            b=$(head -c3 inbound-drive/bracelets2.jpg | od -An -tx1 | tr -d ' \n')
            echo "bracelets via $u -> $(stat -c%s inbound-drive/bracelets2.jpg) magic=$b"
            [ "$b" = "ffd8ff" ] && break
          done
      - name: Commit
        if: always()
        run: |
          git config user.name "arena-agent"; git config user.email "agent@arena.ai"
          git add -A inbound-drive
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "chore: full Drive folder dump for v57 assets" && git push
