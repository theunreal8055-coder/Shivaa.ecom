name: Billing bridge

# Carries an Arena-authored job to the live billing app.
#
#   agent writes billing/jobs/<stamp>-<slug>.json and pushes
#     -> this workflow fires on the push (no dispatch permission needed)
#     -> it POSTs the job to https://shivaa.in/billing/inbox.php
#     -> the server verifies the kill switch, timestamp, nonce and shop
#        admin password, then forwards into the normal api.php route
#     -> the response is committed back as billing/jobs/<name>.receipt.json
#     -> the agent reads the receipt
#
# The runner never sees the database. It only speaks HTTPS to the server,
# which already holds the credentials.
#
# NEVER committed: the admin password. It comes from secrets at run time and
# is written into the request body only.

on:
  push:
    branches: [arena/01a0d70e-shivaa-ecom]
    paths: ['billing/jobs/*.json']

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deliver pending jobs
        env:
          SHIVAA_ADMIN_PASSWORD: ${{ secrets.SHIVAA_ADMIN_PASSWORD }}
          ENDPOINT: https://shivaa.in/billing/inbox.php
        run: python3 .github/scripts/bridge-deliver.py

      - name: Commit receipts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A billing/jobs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "billing: bridge receipts [skip ci]"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi

# Re-pushed to register the workflow definition.
