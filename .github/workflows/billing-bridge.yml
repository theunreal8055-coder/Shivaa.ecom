name: Billing bridge

# Carries an Arena-authored job to the live billing app.
#
#   agent writes billing/jobs/<stamp>-<slug>.json and pushes
#     -> this workflow fires on the push (no dispatch permission needed)
#     -> it POSTs the job to https://shivaa.in/billing/inbox.php
#     -> the server verifies the kill switch, timestamp, nonce and shop
#        admin password, then forwards into the normal api.php route
#     -> the response is committed back as billing/jobs/<name>.receipt.json
#     -> the agent reads the receipt
#
# The runner never sees the database. It only speaks HTTPS to the server,
# which already holds the credentials.
#
# NEVER committed: the admin password. It comes from secrets at run time and
# is written into the request body only.

on:
  push:
    branches: [arena/01a0d70e-shivaa-ecom]
    paths: ['billing/jobs/*.json']

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deliver pending jobs
        env:
          SHIVAA_ADMIN_PASSWORD: ${{ secrets.SHIVAA_ADMIN_PASSWORD }}
          ENDPOINT: https://shivaa.in/billing/inbox.php
        run: |
          mkdir -p billing/jobs
          shopt -s nullglob
          jobs=(billing/jobs/*.json)
          # Skip receipts so a receipt commit cannot retrigger delivery.
          pending=()
          for j in "${jobs[@]}"; do
            case "$j" in *.receipt.json) ;; *) pending+=("$j") ;; esac
          done
          echo "found ${#pending[@]} pending job file(s)"
          if [ "${#pending[@]}" -eq 0 ]; then echo "nothing to deliver"; exit 0; fi

          for j in "${pending[@]}"; do
            base="${j%.json}"
            echo "--- delivering $j"
            # Stamp the auth, a fresh nonce and the current time onto the job
            # the agent authored, without ever writing them into the repo.
            python3 - "$j" > /tmp/payload.json <<'PY'
            import json, os, secrets, sys, time
            job = json.load(open(sys.argv[1]))
            job['auth'] = os.environ['SHIVAA_ADMIN_PASSWORD']
            job['nonce'] = secrets.token_hex(16)
            job['ts'] = int(time.time())
            json.dump(job, sys.stdout)
            PY
            # HTTP 200 alone proves nothing: if inbox.php is missing the SPA
            # fallback answers 200 with the storefront homepage. Only a JSON
            # body carrying an "ok" field counts as the endpoint answering.
            python3 - "$j" "$base.receipt.json" "$ENDPOINT" <<'PY'
            import json, os, subprocess, sys, datetime
            src, receipt, endpoint = sys.argv[1], sys.argv[2], sys.argv[3]
            raw = subprocess.run(
                ['curl', '-s', '-D', '/tmp/hdr', '-o', '/tmp/resp.json',
                 '-w', '%{http_code}', '--max-time', '60',
                 '-H', 'Content-Type: application/json',
                 '--data-binary', '@/tmp/payload.json', endpoint],
                capture_output=True, text=True)
            code = (raw.stdout or '000').strip() or '000'
            ctype = ''
            for line in open('/tmp/hdr', errors='replace'):
                if line.lower().startswith('content-type:'):
                    ctype = line.split(':', 1)[1].strip()
            body = open('/tmp/resp.json', errors='replace').read()
            try:
                parsed = json.loads(body)
            except Exception:
                parsed = None
            ok = (code == '200' and isinstance(parsed, dict)
                  and 'ok' in parsed and 'application/json' in ctype)
            out = {
                'job': os.path.basename(src),
                'http': code,
                'content_type': ctype,
                'delivered_at': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
                'accepted': bool(ok),
                'response': parsed if parsed is not None else body[:400],
            }
            if not ok:
                out['note'] = ('The endpoint did not answer as JSON. Most likely '
                               'billing/inbox.php is not installed, so the storefront '
                               'fallback served this page instead.')
            json.dump(out, open(receipt, 'w'), indent=2)
            print('    http %s  content-type %s  accepted %s' % (code, ctype or '-', ok))
            PY
            # Only delete the job once the endpoint genuinely accepted it, so a
            # failed delivery is retried by the next push rather than lost.
            if python3 -c "import json,sys;sys.exit(0 if json.load(open('$base.receipt.json')).get('accepted') else 1)"; then
              rm -f "$j"
              echo "    job consumed"
            else
              echo "    NOT accepted — job left in place for retry"
            fi
            rm -f /tmp/payload.json /tmp/hdr /tmp/resp.json
          done

      - name: Commit receipts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A billing/jobs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "billing: bridge receipts [skip ci]"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi

