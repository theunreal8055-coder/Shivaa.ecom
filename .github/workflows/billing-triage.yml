name: Billing vendor triage

# Why this exists: the Arena sandbox can reach github.com / api.github.com /
# codeload.github.com but NOT *.actions.githubusercontent.com or
# release-assets.githubusercontent.com, so it can neither download a release
# asset nor read Actions logs. This runner therefore does the work inside
# GitHub's network AND commits its findings back into the repo, where the
# sandbox can read them with plain git.
#
# The 232 MB payload never enters git:
#   - nothing over 1 MB is committed
#   - credential-bearing files (config.php, .env*, wp-config*.php,
#     database.php, *credential*, *secret*, *.pem, *.key) are LISTED in the
#     inventory but never committed
#   - vendor/, node_modules/, uploads/, images/, fonts/, cache/ are excluded
#   - the commit message carries [skip ci] so this cannot retrigger itself

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag holding the vendor zip"
        required: false
        default: "billing-vendor-drop-1"
        type: string
  push:
    branches: [arena/01a0d70e-shivaa-ecom]
    paths: [.github/workflows/billing-triage.yml]

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download, extract, inventory, stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'billing-vendor-drop-1' }}
        run: |
          # No `set -e`: every stage records its own outcome so a failure in a
          # later stage still yields the inventory from the earlier ones.
          R=/tmp/report.md
          : > "$R"
          note() { printf '%s\n' "$*" >> "$R"; }
          step() {
            local name="$1"; shift
            note ""
            note "## $name"
            note ""
            if out=$("$@" 2>&1); then
              note "RESULT: ok"
            else
              note "RESULT: FAILED (exit $?)"
            fi
            note ""
            note '```'
            printf '%s\n' "${out:-<no output>}" | head -120 >> "$R"
            note '```'
          }
          sh_step() {
            local name="$1"; shift
            note ""
            note "## $name"
            note ""
            if out=$(bash -c "$1" 2>&1); then
              note "RESULT: ok"
            else
              note "RESULT: FAILED (exit $?)"
            fi
            note ""
            note '```'
            printf '%s\n' "${out:-<no output>}" | head -200 >> "$R"
            note '```'
          }

          note "# Billing vendor triage — $(date -u +%FT%TZ)"
          note ""
          note "Release tag: \`$TAG\` · runner: $RUNNER_OS · ref: $GITHUB_REF_NAME"

          sh_step "Download the release asset" '
            set -x
            mkdir -p /tmp/vendor
            gh release download "$TAG" -D /tmp/vendor --clobber
            ls -la /tmp/vendor
            sha256sum /tmp/vendor/*.zip
          '

          sh_step "Extract" '
            set -x
            mkdir -p /tmp/x
            ZIP=$(ls /tmp/vendor/*.zip | head -1)
            unzip -q -o "$ZIP" -d /tmp/x
            echo "extracted files: $(find /tmp/x -type f | wc -l)"
            ls -la /tmp/x
          '

          sh_step "Totals" '
            cd /tmp/x
            echo "files: $(find . -type f | wc -l)"
            echo "bytes: $(find . -type f -printf "%s\n" | awk "{s+=\$1} END {print s}")"
            echo "dirs:  $(find . -type d | wc -l)"
          '

          sh_step "Top-level entries" 'cd /tmp/x && ls -la'

          sh_step "Directory tree (depth 3)" '
            cd /tmp/x && find . -maxdepth 3 -type d | sort | head -180
          '

          sh_step "By extension (count)" '
            cd /tmp/x && find . -type f | sed "s/.*\.//" | sort | uniq -c | sort -rn | head -45
          '

          sh_step "40 largest files" '
            cd /tmp/x && find . -type f -printf "%s %p\n" | sort -rn | head -40
          '

          sh_step "PHP files (first 400 by path)" '
            cd /tmp/x && find . -type f -name "*.php" -printf "%s %p\n" | sort -k2 | head -400
          '

          sh_step "SQL dumps" '
            cd /tmp/x && find . -type f -name "*.sql" -printf "%s %p\n" | sort -rn | head -40
          '

          sh_step "Stack markers" '
            cd /tmp/x
            find . -maxdepth 4 -type f \( -name composer.json -o -name package.json \
              -o -name artisan -o -name "wp-config*.php" -o -name index.php \
              -o -name ".env*" -o -name version.php -o -name "README*" \
              -o -name "*.lock" \) -printf "%s %p\n" | sort -k2 | head -60
          '

          sh_step "Credential-bearing files (LISTED ONLY — never committed)" '
            cd /tmp/x
            find . -type f \( -iname config.php -o -iname ".env*" -o -iname "wp-config*.php" \
              -o -iname database.php -o -iname "*credential*" -o -iname "*secret*" \
              -o -iname "*.pem" -o -iname "*.key" \) -printf "%s %p\n" | sort -k2 | head -60
          '

          sh_step "App source tree (hbuilds/last-source, minus build output)" '
            cd /tmp/x/hbuilds/last-source 2>/dev/null || { echo "last-source missing"; exit 0; }
            find . -type f -not -path "./.next/*" -not -path "./node_modules/*" \
              -printf "%s %p\n" | sort -k2 | head -300
          '

          sh_step "public_html contents" '
            cd /tmp/x/public_html 2>/dev/null || { echo "public_html missing"; exit 0; }
            find . -type f -printf "%s %p\n" | sort -k2 | head -60
          '

          sh_step "Stage the code-only subset" '
            set -x
            rm -rf /tmp/dest && mkdir -p /tmp/dest
            cd /tmp/x
            # NOTE: -size -1048576c, NOT -size -1M. GNU find rounds sizes UP to
            # the next unit, so "-size -1M" matches only 0-byte files (that is
            # why the first run staged nothing).
            find . -type f -size -1048576c \
              \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \
                 -o -name "*.mjs" -o -name "*.cjs" -o -name "*.json" -o -name "*.css" \
                 -o -name "*.scss" -o -name "*.html" -o -name "*.md" -o -name "*.yml" \
                 -o -name "*.yaml" -o -name "*.prisma" -o -name "*.sql" \
                 -o -name "*.txt" -o -name ".htaccess" -o -name ".gitignore" \) \
              -not -path "*/node_modules/*" \
              -not -path "*/.next/*" \
              -not -path "*/hbuilds/current/*" \
              -not -path "*/hbuilds/versions/*" \
              -not -path "*/.git/*" \
              | sort | head -4000 > /tmp/keep.txt
            grep -viE "(^|/)(config\.php|\.env[^/]*|wp-config[^/]*\.php|database\.php)$" /tmp/keep.txt \
              | grep -viE "credential|secret|\.pem$|\.key$" > /tmp/keep2.txt || true
            echo "candidates: $(wc -l < /tmp/keep.txt)  after secret filter: $(wc -l < /tmp/keep2.txt)"
            tar -cf - -T /tmp/keep2.txt 2>/dev/null | tar -xf - -C /tmp/dest 2>/dev/null || \
              echo "tar copy reported a problem"
            echo "staged files: $(find /tmp/dest -type f | wc -l)"
            echo "staged bytes: $(find /tmp/dest -type f -printf "%s\n" | awk "{s+=\$1} END {print s+0}")"
            find /tmp/dest -type f | sort | head -80
          '

          cp "$R" /tmp/report-final.md
          echo "report written: $(wc -l < /tmp/report-final.md) lines"

      - name: Commit findings back into the repo
        if: always()
        run: |
          mkdir -p billing
          if [ -f /tmp/report-final.md ]; then
            cp /tmp/report-final.md billing/VENDOR-INVENTORY.md
          else
            echo "# Triage produced no report — the runner failed before writing one." \
              > billing/VENDOR-INVENTORY.md
          fi
          if [ -d /tmp/dest ] && [ -n "$(ls -A /tmp/dest 2>/dev/null)" ]; then
            rm -rf billing/vendor-src
            mkdir -p billing/vendor-src
            cp -a /tmp/dest/. billing/vendor-src/
            echo "staged code subset: $(find billing/vendor-src -type f | wc -l) files"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add billing
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "billing: vendor drop triage — inventory + code subset [skip ci]"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
