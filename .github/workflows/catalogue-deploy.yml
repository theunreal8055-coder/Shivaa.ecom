name: Catalogue Deploy

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Type YES to make the live catalogue exactly the master records in db.json — PGS rings + SHV scheme studs (delete strays, upload photos + records). Anything else runs a dry-run."
        required: true
        default: "NO"
        type: string
      email:
        description: "Shivaa admin email"
        required: true
        default: "admin@shivaa.in"
        type: string
      require_zoom_pass:
        description: "YES = refuse to deploy while any cover/editorial still fails the zoom QA gate. NO = deploy regardless (emergency use only)."
        required: false
        default: "YES"
        type: string
  # Every PR against main auto-validates the deploy script with a DRY-RUN
  # (login + read live catalogue + plan; never writes). The zoom gate is
  # advisory during the fix phase so batch PRs don't block on pending re-rolls.
  pull_request:
    branches: [main]
  # Autonomous live deploy: pushing the GO marker file to main (PR merge only —
  # main is protected) fires the REAL run. Zoom gate is hard-enforced UNLESS
  # the marker also contains ZOOM_GATE=NO (conscious override).
  push:
    branches: [main]
    paths: ['deploy/GO-LIVE-v111.txt']

permissions:
  contents: read

concurrency:
  group: shivaa-catalogue-deploy
  cancel-in-progress: false

jobs:
  deploy-catalogue:
    name: Make live catalogue exactly the master catalogue (PGS + SHV)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install image QA deps
        run: python3 -m pip install --quiet pillow numpy scipy

      - name: Preflight master catalogue + zoom QA gate
        env:
          PR_MODE: ${{ github.event_name == 'pull_request' }}
          PUSH_MODE: ${{ github.event_name == 'push' }}
          REQUIRE_ZOOM_PASS: ${{ github.event_name == 'push' && 'YES' || (github.event_name == 'pull_request' && 'NO' || inputs.require_zoom_pass) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          db = json.loads(Path('cms/data/db.json').read_text())
          prods = db['products']
          errors = []
          if not prods:
              errors.append('master db.json has no products')
          for p in prods:
              if not str(p.get('sku', '')).startswith(('PGS', 'SHV')):
                  errors.append(f"non-master-SKU product in master: {p.get('sku')}")
              if p.get('video'):
                  errors.append(f"{p.get('sku')}: still has video key")
              if len(p.get('images', [])) < 4:
                  errors.append(f"{p.get('sku')}: fewer than 4 images")
              for im in p.get('images', [])[:4]:
                  if not (Path('cms') / im.lstrip('/')).is_file():
                      errors.append(f"{p.get('sku')}: missing file {im}")
          stud_skus = sorted(p.get('sku') for p in prods if str(p.get('sku', '')).startswith('SHV'))
          if stud_skus != sorted(['SHV-MST-01', 'SHV-MST-02', 'SHV-MST-03', 'SHV-LST-01', 'SHV-LST-02', 'SHV-LST-03']):
              errors.append(f"scheme stud SKU set changed: {stud_skus}")
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'preflight OK: {len(prods)} master products (PGS {len(prods) - len(stud_skus)} + SHV studs {len(stud_skus)}), 4 shots each, all files present, no videos')
          PY
          echo "--- zoom QA on the v111 zoom-campaign covers + editorials (PGS5001-5065 only;"
          echo "    the ladies-67 lot has its own contact-sheet QA per LADIES67-STATE.md) ---"
          python3 tools/photoshoot/zoom_check.py --sku \
            $(python3 -c "import json;print(' '.join(p['sku'] for p in json.load(open('cms/data/db.json'))['products'] if p['sku'].startswith('PGS') and int(p['sku'][3:])<=5065))") \
            > zoom-report.txt 2>&1 || true
          cat zoom-report.txt
          FAILS=$(grep -c FAIL zoom-report.txt || true)
          PASSES=$(grep -c PASS zoom-report.txt || true)
          echo "zoom QA: ${PASSES} PASS, ${FAILS} FAIL"
          if [ "$PUSH_MODE" = "true" ]; then
            if ! grep -q "GO" deploy/GO-LIVE-v111.txt 2>/dev/null; then
              echo "::error::GO-LIVE marker file does not contain GO — refusing to run."
              exit 1
            fi
            if grep -q "ZOOM_GATE=NO" deploy/GO-LIVE-v111.txt 2>/dev/null; then
              REQUIRE_ZOOM_PASS=NO
              echo "PUSH MODE: GO-LIVE marker requests ZOOM_GATE=NO (conscious override — deploy proceeds, zoom leftovers stay on the follow-up ledger)."
            else
              echo "PUSH MODE: zoom gate is HARD-enforced."
            fi
          fi
          if [ "$REQUIRE_ZOOM_PASS" = "YES" ] && [ "$FAILS" != "0" ]; then
            echo "::error::${FAILS} shot(s) still fail the zoom gate — finish the v111 zoom-fix batches or set require_zoom_pass=NO / ZOOM_GATE=NO consciously."
            exit 1
          fi
          if [ "$FAILS" != "0" ]; then
            echo "::warning::${FAILS} shot(s) still fail zoom QA — live deploy continues because the zoom gate is not required this run."
          fi

      - name: Run catalogue deploy (PRs are always dry-runs)
        env:
          ADMIN_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.email || 'admin@shivaa.in' }}
          ADMIN_PASSWORD: ${{ secrets.SHIVAA_ADMIN_PASSWORD }}
          LIVE: ${{ github.event_name == 'push' && 'YES' || (github.event_name == 'pull_request' && 'NO' || inputs.live) }}
        run: |
          set -euo pipefail
          echo "event=${GITHUB_EVENT_NAME:-} LIVE='$LIVE' email='$ADMIN_EMAIL' password_set=$([ -n "${ADMIN_PASSWORD:-}" ] && echo yes || echo no)"
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "::error::Repository secret SHIVAA_ADMIN_PASSWORD is not set."
            exit 1
          fi
          set +e
          if [ "$LIVE" = "YES" ]; then
            echo "LIVE=YES confirmed: live catalogue becomes exactly the master records (PGS rings + SHV scheme studs)."
            python3 deploy/catalogue_deploy.py --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --live > catalogue-deploy.log 2>&1
          else
            echo "LIVE is '$LIVE' (not YES): dry-run only."
            python3 deploy/catalogue_deploy.py --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" > catalogue-deploy.log 2>&1
          fi
          code=$?
          set -e
          cat catalogue-deploy.log
          if [ "$code" -ne 0 ]; then
            echo "::error::catalogue_deploy.py exited $code"
            python3 - <<'PY'
          from pathlib import Path
          text = Path('catalogue-deploy.log').read_text(errors='replace')
          for line in text.splitlines()[-20:]:
              line = line.replace('\r', '').strip()
              if line:
                  print(f'::error::{line[:240]}')
          PY
            exit "$code"
          fi

      - name: Independently verify live catalogue
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.live == 'YES') }}
        env:
          ADMIN_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.email || 'admin@shivaa.in' }}
          ADMIN_PASSWORD: ${{ secrets.SHIVAA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          BASE = 'https://shivaa.in'
          def api(route, method='GET', token=None, body=None, timeout=180):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + route, data=data, method=method,
                  headers={'Content-Type': 'application/json'} if data else {})
              if token: req.add_header('Authorization', f'Bearer {token}')
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      payload = r.read().decode()
                      return r.status, json.loads(payload) if payload else {}
              except urllib.error.HTTPError as e:
                  payload = e.read().decode()
                  try: return e.code, json.loads(payload) if payload else {}
                  except Exception: return e.code, {'error': payload or str(e)}
          st, login = api('/api/auth/login', 'POST', body={'email': os.environ['ADMIN_EMAIL'], 'password': os.environ['ADMIN_PASSWORD']})
          if st != 200 or not login.get('token'):
              print(f'::error::verification login failed ({st}): {login}'); sys.exit(1)
          st, products = api('/api/products', token=login['token'])
          if st != 200:
              print(f'::error::verification GET /api/products failed ({st}): {products}'); sys.exit(1)
          live = products.get('products', [])
          master_live = [p for p in live if str(p.get('sku', '')).startswith(('PGS', 'SHV'))]
          strays = [p for p in live if not str(p.get('sku', '')).startswith(('PGS', 'SHV'))]
          with_video = [p for p in live if p.get('video')]
          undershot = [p.get('sku') for p in master_live if len(p.get('images', [])) < 4]
          studs_real = [p.get('sku') for p in master_live if str(p.get('sku', '')).startswith('SHV') and not p.get('isCampaignStud')]
          print(f'Live verification: total={len(live)}, master={len(master_live)}, strays={len(strays)}, videos={len(with_video)}, under_4_shot={undershot}, studs_real_rows={len(studs_real)}/6')
          want = {p['sku'] for p in json.loads(open('cms/data/db.json').read())['products']}
          got = {p['sku'] for p in master_live}
          ok = got == want and not strays and not with_video and not undershot and len(studs_real) == 6
          if not ok:
              print(f'::error::live catalogue does not match the master contract (missing={sorted(want - got)[:5]} extra={sorted(got - want)[:5]} strays={len(strays)} studs_real={len(studs_real)}/6)'); sys.exit(1)
          print(f'VERIFY OK: live site shows exactly the {len(want)} master records (PGS rings + 6 SHV scheme studs as real rows), 4 shots each, no videos, zero stray products ✅')
          PY
